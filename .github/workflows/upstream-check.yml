name: Upstream update check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Report upstream changes
        run: node dist/cli.js check-upstreams --fail-on-update
