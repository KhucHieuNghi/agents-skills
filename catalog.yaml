  codebase-onboarding:
    manifest: solutions/codebase-onboarding.yaml
  problem-presentation:
    manifest: solutions/problem-presentation.yaml
skills:
  html-docs-standard:
    source: bundled
    tags: [documentation, onboarding]
    summary: Creates light-only, engineer-facing HTML documentation.
    suitableFor: [documentation, onboarding, runbook]
    notSuitableFor: [product-ui, visual-exploration]
  codebase-onboarding-c4:
    source: bundled
    tags: [onboarding, architecture, c4]
    summary: Maps an unfamiliar codebase into evidence-backed product and technical onboarding.
    suitableFor: [codebase-onboarding, architecture-discovery]
    notSuitableFor: [single-file-change, quick-fix]
  html-slides:
    source: bundled
    upstream_reference: https://github.com/claude-office-skills/skills/tree/main/html-slides
    upstream_license: MIT
    tags: [presentation, slides, revealjs]
    summary: Creates branded, offline-capable HTML presentations with local reveal.js.
    suitableFor: [presentation, slides, tech-talk]
    notSuitableFor: [documentation, onboarding, landing-page]
  problem-presentation:
    source: bundled
    tags: [presentation, problem-framing, decision]
    summary: Presents one evidenced problem and a concrete decision in a branded offline HTML and PDF deck.
    suitableFor: [problem-briefing, decision-presentation]
    notSuitableFor:
      [general-slide-design, roadmap-planning, codebase-onboarding]
  presentation-brand:
    source: bundled
    tags: [presentation, branding, offline]
    summary: Creates a source-traceable presentation brand profile and local logo with a provisional fallback.
    suitableFor: [presentation-branding, slide-design]
    notSuitableFor: [company-identity-verification, general-website-design]
  hallmark:
    source: hallmark-upstream
    tags: [style, landing-page, redesign, documentation-polish]
    summary: Builds, audits, or polishes distinctive public-facing UI while preserving an existing project.
    suitableFor: [landing-page, redesign, design-audit, documentation-polish]
    notSuitableFor: [data-dashboard, dense-workflow]
  archify:
    source: archify-upstream
    tags: [diagrams, architecture, interactive-html]
    summary: Creates validated interactive HTML diagrams from typed JSON, including architecture, workflow, and data flows.
    suitableFor:
      [architecture-diagram, workflow-diagram, codebase-visualization]
    notSuitableFor: [numeric-dashboard, editorial-brand-diagram]
  diagram-design:
    source: diagram-design-upstream
    tags: [diagrams, design, svg]
    summary: Creates editorial, branded diagrams as self-contained HTML and SVG.
    suitableFor: [branded-diagram, architecture-diagram, visual-explanation]
    notSuitableFor: [quick-text-diagram, interactive-topology-explorer]
  frontend-design:
    source: frontend-design-upstream
    tags: [frontend, website, design]
    summary: Guides distinctive production frontend design and implementation.
    suitableFor: [landing-page, website-redesign]
    notSuitableFor: [product-evidence, customer-research]
  copywriting:
    source: copywriting-upstream
    tags: [marketing, copywriting, website]
    summary: Helps structure clear, specific customer-facing website copy.
    suitableFor: [landing-page-copy, product-messaging]
    notSuitableFor: [verified-customer-proof, release-validation]
profiles:
  documentation:
    intents: [documentation, onboarding, runbook]
    skills: [html-docs-standard, hallmark]
    summary: Produces consistent, responsive documentation for engineers with a constrained Hallmark polish pass.
    suitableFor: [documentation, onboarding, runbook]
    notSuitableFor: [product-ui, visual-exploration]
  codebase-onboarding:
    intents: [codebase-onboarding, architecture-discovery]
    skills: [codebase-onboarding-c4, html-docs-standard, hallmark]
    summary: Creates journey-first product and C4 onboarding with local Markdown, polished HTML, and resumable evidence state.
    suitableFor: [codebase-onboarding, architecture-discovery]
    notSuitableFor: [single-file-change, quick-fix]
  hallmark-landing:
    intents: [landing-page, redesign, design-audit]
    skills: [hallmark]
    summary: Creates a distinctive landing page or reviews an existing public-facing experience.
    suitableFor: [landing-page, redesign, design-audit]
    notSuitableFor: [data-dashboard, dense-workflow]
  presentation:
    intents: [presentation, slides, tech-talk]
    skills: [html-slides, html-docs-standard]
    summary: Creates branded offline HTML presentations with reveal.js, sharing the local brand profile.
    suitableFor: [presentation, slides, tech-talk]
    notSuitableFor: [documentation, onboarding, landing-page]
  campaign-website:
    intents: [landing-page, website-redesign, product-messaging]
    skills: [frontend-design, copywriting, hallmark]
    summary: An authoring profile for the NKSkills website; not a released customer Solution Skill.
    suitableFor: [landing-page, website-redesign, product-messaging]
    notSuitableFor: [customer-solution-release, market-validation]
