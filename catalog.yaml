skills:
  html-docs-standard:
    source: bundled
    tags: [documentation, onboarding]
    summary: Creates light-only, engineer-facing HTML documentation.
    suitableFor: [documentation, onboarding, runbook]
    notSuitableFor: [product-ui, visual-exploration]
  codebase-onboarding-c4:
    source: bundled
    tags: [onboarding, architecture, c4]
    summary: Maps an unfamiliar codebase into evidence-backed product and technical onboarding.
    suitableFor: [codebase-onboarding, architecture-discovery]
    notSuitableFor: [single-file-change, quick-fix]
  html-slides:
    source: bundled
    upstream_reference: https://github.com/claude-office-skills/skills/tree/main/html-slides
    upstream_license: MIT
    tags: [presentation, slides, revealjs]
    summary: Creates branded, offline-capable HTML presentations with local reveal.js.
    suitableFor: [presentation, slides, tech-talk]
    notSuitableFor: [documentation, onboarding, landing-page]
  problem-presentation:
    source: bundled
    tags: [presentation, problem-framing, decision]
    summary: Presents one evidenced problem and a concrete decision in a short offline HTML deck.
    suitableFor: [problem-briefing, decision-presentation]
    notSuitableFor:
      [general-slide-design, roadmap-planning, codebase-onboarding]
  hallmark:
    source: hallmark-upstream
    tags: [style, landing-page, redesign, documentation-polish]
    summary: Builds, audits, or polishes distinctive public-facing UI while preserving an existing project.
    suitableFor: [landing-page, redesign, design-audit, documentation-polish]
    notSuitableFor: [data-dashboard, dense-workflow]
  archify:
    source: archify-upstream
    tags: [diagrams, architecture, interactive-html]
    summary: Creates validated interactive HTML diagrams from typed JSON, including architecture, workflow, and data flows.
    suitableFor:
      [architecture-diagram, workflow-diagram, codebase-visualization]
    notSuitableFor: [numeric-dashboard, editorial-brand-diagram]
  diagram-design:
    source: diagram-design-upstream
    tags: [diagrams, design, svg]
    summary: Creates editorial, branded diagrams as self-contained HTML and SVG.
    suitableFor: [branded-diagram, architecture-diagram, visual-explanation]
    notSuitableFor: [quick-text-diagram, interactive-topology-explorer]
profiles:
  documentation:
    intents: [documentation, onboarding, runbook]
