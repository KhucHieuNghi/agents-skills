    skills: [codebase-onboarding-c4, html-docs-standard, hallmark]
    summary: Creates journey-first product and C4 onboarding with local Markdown, polished HTML, and resumable evidence state.
    suitableFor: [codebase-onboarding, architecture-discovery]
    notSuitableFor: [single-file-change, quick-fix]
  hallmark-landing:
    intents: [landing-page, redesign, design-audit]
