<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-labelledby="title desc">
  <title id="title">NKSkills codebase onboarding workflow</title>
  <desc id="desc">Hallmark and original skills compose into codebase-onboarding version 1.1.0, used in Codex or Claude Code to produce a cited product journey and C1/C2 architecture views.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#e9f3ff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#213b69" flood-opacity=".1"/></filter></defs>
  <rect x="1" y="1" width="1158" height="308" rx="24" fill="url(#bg)" stroke="#dce6f4"/>
  <path d="M255 155h65m270 0h65m210 0h50" fill="none" stroke="#7ca8eb" stroke-width="3" stroke-linecap="round"/>
  <path d="m310 145 12 10-12 10m335-20 12 10-12 10m255-20 12 10-12 10" fill="none" stroke="#7ca8eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="40" y="78" width="215" height="154" rx="18" fill="#fff"/><rect x="322" y="60" width="268" height="190" rx="20" fill="#2458d8"/><rect x="655" y="78" width="210" height="154" rx="18" fill="#fff"/><rect x="915" y="78" width="205" height="154" rx="18" fill="#fff"/></g>
  <g font-family="Arial,Helvetica,sans-serif"><text x="62" y="113" fill="#2458d8" font-size="12" font-weight="700" letter-spacing="2">INPUT</text><text x="62" y="148" fill="#14263d" font-size="20" font-weight="700">Hallmark +</text><text x="62" y="177" fill="#14263d" font-size="20" font-weight="700">original skills</text><text x="62" y="206" fill="#52657d" font-size="12">pinned and traceable</text>
  <text x="349" y="99" fill="#cfe0ff" font-size="12" font-weight="700" letter-spacing="2">SOLUTION SKILL</text><text x="349" y="148" fill="#fff" font-size="26" font-weight="700">codebase-</text><text x="349" y="180" fill="#fff" font-size="26" font-weight="700">onboarding</text><text x="349" y="217" fill="#dce8ff" font-size="14">version 1.1.0</text>
  <text x="679" y="113" fill="#2458d8" font-size="12" font-weight="700" letter-spacing="2">HOST</text><text x="679" y="153" fill="#14263d" font-size="22" font-weight="700">Codex or</text><text x="679" y="184" fill="#14263d" font-size="22" font-weight="700">Claude Code</text>
  <text x="937" y="113" fill="#2458d8" font-size="12" font-weight="700" letter-spacing="2">OUTPUT</text><text x="937" y="148" fill="#14263d" font-size="20" font-weight="700">Cited journey</text><text x="937" y="178" fill="#14263d" font-size="20" font-weight="700">+ C1/C2 views</text><text x="937" y="207" fill="#52657d" font-size="12">review before use</text></g>
</svg>
