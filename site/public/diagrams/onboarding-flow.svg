<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 310" role="img" aria-labelledby="title desc">
  <title id="title">NKSkills codebase onboarding workflow</title>
  <desc id="desc">Hallmark and original skills compose into codebase-onboarding version 1.1.0, used in Codex or Claude Code to produce a cited product journey and C1/C2 architecture views.</desc>
  <rect width="1160" height="310" rx="12" fill="#122b36"/>
  <path d="M30 74h1100M290 94v186M570 94v186M850 94v186" stroke="#5c7b83" stroke-opacity=".55"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5" fill="#8ce8cb">
    <text x="30" y="45">NK / WORKFLOW 001</text>
    <text x="817" y="45">PINNED → REVIEWABLE</text>
    <text x="30" y="115">01 / INPUT</text>
    <text x="310" y="115">02 / SOLUTION SKILL</text>
    <text x="590" y="115">03 / HOST</text>
    <text x="870" y="115">04 / OUTPUT</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f5f8f6">
    <text x="30" y="175">Hallmark +</text><text x="30" y="207">original skills</text>
    <text x="310" y="175">codebase-</text><text x="310" y="207">onboarding</text>
    <text x="590" y="175">Codex or</text><text x="590" y="207">Claude Code</text>
    <text x="870" y="175">Cited journey</text><text x="870" y="207">+ C1/C2 views</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#a8bec4">
    <text x="30" y="258">Source and revision recorded</text>
    <text x="310" y="258">Version 1.1.0</text>
    <text x="590" y="258">Two supported hosts</text>
    <text x="870" y="258">Review before use</text>
  </g>
</svg>
