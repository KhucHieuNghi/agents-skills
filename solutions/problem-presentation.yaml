version: 0.1.0
outcome: A decision-ready, evidence-backed problem presentation with a traceable brand, offline HTML deck, and matching PDF.
entrypoint: problem-presentation
hosts: [codex, claude-code]
qualityGates:
  - The problem, audience, decision, and source-backed claims are explicit; gaps and hypotheses are labelled.
  - Brand name and URL are asked once; absent inputs yield a clearly provisional local identity.
  - Source logo and palette provenance are recorded; generated marks are never described as official.
  - The HTML deck works offline, uses the pinned slide engine, and keeps diagrams factual and accessible.
  - The matching PDF preserves every slide and visible source label after desktop, short, narrow, and print inspection.
